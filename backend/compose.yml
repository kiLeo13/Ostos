services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ostos
      MYSQL_USER: ostos_app
      MYSQL_PASSWORD: local_app_only
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal_root_only"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  migrate:
    build:
      context: ../migrations
    environment:
      OSTOS_MIGRATION_DATABASE_DSN: root:local_root_only@tcp(mysql:3306)/ostos?parseTime=true
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      OSTOS_ENV: development
      OSTOS_HTTP_ADDRESS: :8080
      OSTOS_DATABASE_DSN: ostos_app:local_app_only@tcp(mysql:3306)/ostos?parseTime=true
      OSTOS_SNOWFLAKE_NODE_ID: "0"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  integration:
    image: golang:1.27.2-alpine
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
    environment:
      OSTOS_TEST_MYSQL_DSN: ostos_app:local_app_only@tcp(mysql:3306)/ostos?parseTime=true
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["go", "test", "-count=1", "./..."]

volumes:
  mysql-data:
