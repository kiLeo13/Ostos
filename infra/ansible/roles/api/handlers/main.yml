---
- name: Load versioned API image
  ansible.builtin.shell:
    cmd: "set -o pipefail && gzip -dc /var/lib/ostos/images/{{ ostos_api_version }}.tar.gz | docker image load"
    executable: /bin/bash
  changed_when: true

- name: Restart Ostos API
  ansible.builtin.command:
    cmd: docker compose --env-file /etc/ostos/deploy.env -f /etc/ostos/compose.yml up -d --force-recreate
  register: api_restart
  changed_when: true
