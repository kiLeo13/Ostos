openapi: 3.1.0
info:
  title: Ostos API
  version: 0.2.0
  description: Account, authentication, and Family contract for the Ostos modular monolith.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [operations]
      summary: Report process liveness
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [operations]
      summary: Report dependency readiness
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Error'
  /v1/users:
    post:
      operationId: createUser
      tags: [accounts]
      summary: Create an account and enqueue email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Account created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [accounts]
      summary: Get the authenticated profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCurrentUser
      tags: [accounts]
      summary: Update username or display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCurrentUser
      tags: [accounts]
      summary: Delete the account after password confirmation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmationRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/users/me/password:
    put:
      operationId: changeCurrentUserPassword
      tags: [accounts]
      summary: Change the password and revoke every session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      operationId: login
      tags: [authentication]
      summary: Exchange verified account credentials for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenPair'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      operationId: refreshAuthentication
      tags: [authentication]
      summary: Rotate a refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenPair'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [authentication]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [authentication]
      summary: Revoke every session for the current user
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [authentication]
      summary: Consume an email-verification token
      requestBody:
        $ref: '#/components/requestBodies/AccountToken'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/Error'
  /v1/auth/resend-verification:
    post:
      operationId: resendEmailVerification
      tags: [authentication]
      summary: Enqueue verification when the account is eligible
      requestBody:
        $ref: '#/components/requestBodies/Email'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [authentication]
      summary: Enqueue a password-reset email without disclosing account existence
      requestBody:
        $ref: '#/components/requestBodies/Email'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [authentication]
      summary: Consume a reset token and revoke every session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/families:
    get:
      operationId: listFamilies
      tags: [families]
      summary: List Families visible to the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authorized Family summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilySummary'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createFamily
      tags: [families]
      summary: Create a Family owned by the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyWriteRequest'
      responses:
        '201':
          description: Family created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '409':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      operationId: getFamily
      tags: [families]
      summary: Get one authorized Family
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateFamily
      tags: [families]
      summary: Update Family settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyWriteRequest'
      responses:
        '200':
          description: Updated Family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteFamily
      tags: [families]
      summary: Delete a Family as its Owner
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      operationId: listFamilyMembers
      tags: [families]
      summary: List the synthesized Owner and stored members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Family participants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMember'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      operationId: updateFamilyMember
      tags: [families]
      summary: Promote or demote a stored member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeFamilyMember
      tags: [families]
      summary: Remove a stored member
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/leave:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      operationId: leaveFamily
      tags: [families]
      summary: Leave a Family as a Manager or Member
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '409':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      operationId: transferFamilyOwnership
      tags: [families]
      summary: Transfer ownership to a current stored member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/invitations:
    get:
      operationId: listReceivedInvitations
      tags: [invitations]
      summary: List non-expired invitations received by the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceivedInvitation'
  /v1/invitations/{invitation_id}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation as a Member
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/invitations/{invitation_id}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: declineInvitation
      tags: [invitations]
      summary: Decline and delete an invitation
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      operationId: listFamilyInvitations
      tags: [invitations]
      summary: List non-expired invitations for an administered Family
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sent invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SentInvitation'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createFamilyInvitation
      tags: [invitations]
      summary: Invite by exact username or exact User ID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      operationId: cancelFamilyInvitation
      tags: [invitations]
      summary: Cancel and delete a Family invitation
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-list:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      operationId: getShoppingList
      tags: [shopping]
      summary: Get the current Family shopping list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current shopping list items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-list/items:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      operationId: createShoppingListItem
      tags: [shopping]
      summary: Add an item to the Family shopping list
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListItemCreateRequest'
      responses:
        '201':
          description: Item added.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-list/items/{item_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      operationId: updateShoppingListItem
      tags: [shopping]
      summary: Update a shopping list item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListItemUpdateRequest'
      responses:
        '200':
          description: Updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShoppingListItem
      tags: [shopping]
      summary: Delete a shopping list item
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-list/items/order:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    put:
      operationId: reorderShoppingListItems
      tags: [shopping]
      summary: Reorder shopping list items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListReorderRequest'
      responses:
        '200':
          description: Reordered list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-list/complete:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      operationId: completeShoppingList
      tags: [shopping]
      summary: Complete the shopping list, archive trip history, and process keep or discard items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListCompleteRequest'
      responses:
        '200':
          description: Completion outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListCompleteResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-trips:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      operationId: listShoppingTrips
      tags: [shopping]
      summary: List historical shopping trips for the Family
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Historical shopping trips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTripList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/families/{family_id}/shopping-trips/{trip_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/TripId'
    get:
      operationId: getShoppingTrip
      tags: [shopping]
      summary: Get details of a historical shopping trip
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shopping trip details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingTripDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FamilyId:
      name: family_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeId'
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeId'
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeId'
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeId'
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeId'
  requestBodies:
    AccountToken:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountTokenRequest'
    Email:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailRequest'
  responses:
    Health:
      description: Healthy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    NoContent:
      description: Command completed.
    TokenPair:
      description: Rotating authentication token pair.
      headers:
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenPair'
    Error:
      description: Stable API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SnowflakeId:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '241895317264384000'
    Timestamp:
      type: string
      format: date-time
      example: '2026-10-17T12:00:00Z'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, display_name, email_verified, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        email:
          type: string
          format: email
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email_verified:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Username:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9_-]+$'
    Password:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [email, username, display_name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          $ref: '#/components/schemas/Password'
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
          minLength: 1
          maxLength: 100
    PasswordConfirmationRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          maxLength: 128
          writeOnly: true
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 128
          writeOnly: true
        new_password:
          $ref: '#/components/schemas/Password'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
          writeOnly: true
        device_name:
          type: string
          maxLength: 100
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 200
          writeOnly: true
    AccountTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
          writeOnly: true
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          maxLength: 200
          writeOnly: true
        new_password:
          $ref: '#/components/schemas/Password'
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          writeOnly: true
        refresh_token:
          type: string
          writeOnly: true
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          const: 1800
    FamilyRole:
      type: string
      enum: [owner, manager, member]
    Family:
      type: object
      additionalProperties: false
      required: [id, name, owner_id, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        name:
          type: string
          minLength: 1
          maxLength: 100
        owner_id:
          $ref: '#/components/schemas/SnowflakeId'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    FamilySummary:
      type: object
      additionalProperties: false
      required: [id, name, role, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        name:
          type: string
        role:
          $ref: '#/components/schemas/FamilyRole'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    FamilyWriteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    FamilyMember:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name, role, joined_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        user_id:
          $ref: '#/components/schemas/SnowflakeId'
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/FamilyRole'
        joined_at:
          $ref: '#/components/schemas/Timestamp'
    MemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [manager, member]
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [new_owner_id]
      properties:
        new_owner_id:
          $ref: '#/components/schemas/SnowflakeId'
    InvitationCreateRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [username]
        - required: [user_id]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        user_id:
          $ref: '#/components/schemas/SnowflakeId'
    ReceivedInvitation:
      type: object
      additionalProperties: false
      required: [id, family_id, family_name, expires_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        family_id:
          $ref: '#/components/schemas/SnowflakeId'
        family_name:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    SentInvitation:
      type: object
      additionalProperties: false
      required: [id, user_id, username, display_name, expires_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        user_id:
          $ref: '#/components/schemas/SnowflakeId'
        username:
          $ref: '#/components/schemas/Username'
        display_name:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    Quantity:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,3})?$'
      example: '1.500'
    Unit:
      type: string
      enum: [each, g, kg, ml, l]
      example: kg
    Cents:
      type: integer
      minimum: 0
      example: 1250
    ShoppingListItem:
      type: object
      additionalProperties: false
      required: [id, family_id, name, quantity, unit, is_checked, position, added_by_id, updated_by_id, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        family_id:
          $ref: '#/components/schemas/SnowflakeId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit:
          $ref: '#/components/schemas/Unit'
        note:
          type:
            - string
            - 'null'
          maxLength: 500
        is_checked:
          type: boolean
        purchased_quantity:
          anyOf:
            - $ref: '#/components/schemas/Quantity'
            - type: 'null'
        total_cents:
          anyOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
        position:
          type: integer
        added_by_id:
          $ref: '#/components/schemas/SnowflakeId'
        updated_by_id:
          $ref: '#/components/schemas/SnowflakeId'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ShoppingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListItem'
    ShoppingListItemCreateRequest:
      type: object
      additionalProperties: false
      required: [name, quantity, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit:
          $ref: '#/components/schemas/Unit'
        note:
          type: string
          maxLength: 500
    ShoppingListItemUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit:
          $ref: '#/components/schemas/Unit'
        note:
          type: string
          maxLength: 500
        clear_note:
          type: boolean
        is_checked:
          type: boolean
        purchased_quantity:
          $ref: '#/components/schemas/Quantity'
        clear_purchased_qty:
          type: boolean
        total_cents:
          $ref: '#/components/schemas/Cents'
        clear_total_cents:
          type: boolean
    ShoppingListReorderRequest:
      type: object
      additionalProperties: false
      required: [item_ids]
      properties:
        item_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SnowflakeId'
    ItemActionOverride:
      type: object
      additionalProperties: false
      required: [item_id, action]
      properties:
        item_id:
          $ref: '#/components/schemas/SnowflakeId'
        action:
          type: string
          enum: [keep, discard]
    ShoppingListCompleteRequest:
      type: object
      additionalProperties: false
      required: [default_unchecked_action]
      properties:
        supermarket_name:
          type: string
          maxLength: 120
        default_unchecked_action:
          type: string
          enum: [keep, discard]
        unchecked_item_overrides:
          type: array
          items:
            $ref: '#/components/schemas/ItemActionOverride'
    ShoppingTrip:
      type: object
      additionalProperties: false
      required: [id, family_id, completed_by_id, completed_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        family_id:
          $ref: '#/components/schemas/SnowflakeId'
        supermarket_name:
          type:
            - string
            - 'null'
          maxLength: 120
        completed_by_id:
          $ref: '#/components/schemas/SnowflakeId'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ShoppingTripItem:
      type: object
      additionalProperties: false
      required: [id, trip_id, source_item_id, name, quantity, unit, added_by_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        trip_id:
          $ref: '#/components/schemas/SnowflakeId'
        source_item_id:
          $ref: '#/components/schemas/SnowflakeId'
        name:
          type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        unit:
          $ref: '#/components/schemas/Unit'
        note:
          type:
            - string
            - 'null'
        added_by_id:
          $ref: '#/components/schemas/SnowflakeId'
        purchased_quantity:
          anyOf:
            - $ref: '#/components/schemas/Quantity'
            - type: 'null'
        total_cents:
          anyOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ShoppingTripDetail:
      type: object
      additionalProperties: false
      required: [id, family_id, completed_by_id, completed_at, created_at, items]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        family_id:
          $ref: '#/components/schemas/SnowflakeId'
        supermarket_name:
          type:
            - string
            - 'null'
          maxLength: 120
        completed_by_id:
          $ref: '#/components/schemas/SnowflakeId'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingTripItem'
    ShoppingListCompleteResponse:
      type: object
      additionalProperties: false
      required: [trip]
      properties:
        trip:
          anyOf:
            - $ref: '#/components/schemas/ShoppingTripDetail'
            - type: 'null'
    ShoppingTripList:
      type: object
      additionalProperties: false
      required: [trips]
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingTrip'
        next_cursor:
          type: string
tags:
  - name: operations
    description: Process liveness and required-dependency readiness.
  - name: accounts
    description: Current-user registration and profile lifecycle.
  - name: authentication
    description: Verification, credentials, access JWTs, and rotating sessions.
  - name: families
    description: Family resources, ownership, and role administration.
  - name: invitations
    description: Exact-identifier Family invitations and responses.
  - name: shopping
    description: Shared family grocery list, item mutations, completion, and trip history.
